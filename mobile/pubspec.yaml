name: product_photo_studio
description: AI-driven e-commerce product photography studio.
publish_to: "none"
version: 0.1.0+1

environment:
  # Raised from 3.3.0 for google_mlkit_subject_segmentation, which requires
  # Dart >=3.8.0 / Flutter >=3.32.0. CI tracks the stable channel, which is
  # well past both.
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  image_picker: ^1.1.2
  # Full photo editor (crop/rotate, filters, tune/adjust, blur, paint, text,
  # stickers). Version + API verified against the real package source
  # downloaded from pub.dev (reachable from this sandbox, unlike most
  # registries).
  pro_image_editor: ^13.2.2
  # On-device background removal. The model ships via Google Play Services,
  # so it costs nothing in APK size and nothing per image -- unlike the
  # /ai/* backend endpoints, which bill fal.ai on every call.
  #
  # ANDROID ONLY in practice: the plugin's iOS half is a stub that returns
  # FlutterMethodNotImplemented and its podspec has the ML Kit dependency
  # commented out. Verified by reading the published package source, not
  # assumed -- see lib/ondevice/segmentation_engine.dart.
  google_mlkit_subject_segmentation: ^0.1.0
  google_mlkit_commons: ^0.12.0
  # Runs the bundled u2netp model (assets/models/u2netp.onnx) so background
  # removal still works with no Play Services, on a fresh install before the
  # ML Kit model has downloaded, and on iOS -- where the ML Kit plugin above
  # is only a stub. API verified against the published package source.
  #
  # Not the older `onnxruntime` package: that one is published against
  # compileSdk 33, while its own androidx dependencies require consumers to
  # compile against 34+, so Gradle refuses to build it. This one targets
  # compileSdk 35 and builds cleanly.
  flutter_onnxruntime: ^1.8.3
  # Pure-Dart decode/resize/composite/encode for the post-processing stages.
  image: ^4.9.1
  # Native share sheet for handing a finished ad to WhatsApp, Instagram or
  # anywhere else. API verified against the published package source:
  # SharePlus.instance.share(ShareParams(...)) -- the static Share.share()
  # helpers are deprecated in this major version.
  share_plus: ^13.3.0
  # The owner passcode authorises spending real ad budget, so it goes in the
  # Keystore/Keychain rather than SharedPreferences, which is world-readable
  # on a rooted device.
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # u2netp, 4.4 MB. Bundled deliberately rather than downloaded on first
    # run: a download would reintroduce exactly the network dependency and
    # first-run failure this engine exists to remove.
    - assets/models/u2netp.onnx
