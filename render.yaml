# Render Blueprint for Ad Auto-Pilot's API.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Only GEMINI_API_KEY needs filling in by hand; everything else is set or
# generated here.
#
# The API only. The Next.js front end is deployed on Vercel instead (see
# marketing-autopilot/web/README.md) -- it is served from a CDN there, so it
# has no cold start, and leaving the whole free instance-hours budget to this
# one service is what makes keeping the API warm affordable.
#
# No database is declared. Only the poster worker touches Postgres, and the
# ad-generation flow does not, so the first deploy has one less moving part
# and one less thing to pay for. Add a `databases:` block when the worker
# goes live.
services:
  # ---- API (Express) -------------------------------------------------------
  # Docker, not the Node runtime: the poster renderer needs Tamil fonts
  # installed system-wide, and their absence produces wrong images rather
  # than an error.
  - type: web
    name: adpilot-api
    runtime: docker
    plan: free
    region: singapore # closest Render region to Tamil Nadu
    rootDir: marketing-autopilot
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      # The one value you must paste in yourself.
      - key: GEMINI_API_KEY
        sync: false
      # Random per-environment. Any 32+ char string works; see lib/crypto.ts.
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: MAX_DAILY_BUDGET_INR
        value: 5000
